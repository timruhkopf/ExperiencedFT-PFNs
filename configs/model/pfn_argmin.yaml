# @package model

meta:
  name: 'pfn_argmin'

cls:
  _target_: src.model.mixture_ppd.PFNPPDMixture

  model:
    _target_:  ifbo.surrogate.FTPFN
    version: "0.0.1"
    device: ${device}
    target_path: ${repo_root}/data/.model

  decay_fn:
    _partial_: True
    _target_: src.model.decay.constant_exponential
    lambda_: 0.005
    constant: 100

  mixture_fn:
    _partial_: True
    _target_:  src.model.mixing.argmin

  criterion: Null
  min_context_size: 10
  # related_task_data

inference_kwargs:
  temperature: 1.0