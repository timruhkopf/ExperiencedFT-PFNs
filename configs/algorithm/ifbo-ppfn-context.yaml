defaults:
  - ifbo

name: ppfn
mf: True
sh_based: False


surrogate_model:
  meta:
    name: 'error_ppfn'

  cls:
    _target_: src.model.abstractmodel.AbstractModel

    initial_design:
      _target_: src.model.initial_design.maxpi_initial_design.MaxPIInitialDesign
      size: 10

    strategy:
      _target_: src.model.strategies.meta_context.SplitMetaContextStrategy
      imputer:
        _target_: src.model.components.imputor.PriorImputer
        imputation_mode: median

    imputer:
      _target_: src.model.components.imputor.PriorImputer
      imputation_mode: median

    model:
      _target_:  ifbo.surrogate.FTPFN
      version: "0.0.1"
      device: ${device}
      target_path: ${repo_root}/data/.model

    callbacks:
        - _target_: callbacks.callback_1d_projection.Callback1dProjectionPFNContext
          _partial_: True


    flippable: False





