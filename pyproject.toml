    "submitit==1.5.2",
    "tqdm==4.62.1",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "ConfigSpace==1.2.1",
    "nltk==3.8.1",
    "fire",
    "path==16.7.1",

    # if these don't work immediately:
    # pip install -r core_requirements.txt
    "ifBO_icml2024/src/neps_lcpfn_hpo",
    "ifBO_icml2024/src/mf-prior-bench",
    "ifBO_icml2024/src/PFNs4HPO",
    "ifBO_icml2024/src/pfns_hpo",


    "torch==1.13.1",
