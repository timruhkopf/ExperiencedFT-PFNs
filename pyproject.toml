[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ExperiencedFTPFN"
version = "0.3.0"
description = "In-Context Distillation for warm starting FTPFN
authors = [
    { name="Tim Ruhkopf", email="timruhkopf@gmail.com" },
    { name="Marius Lindauer"}
]
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "numpy==1.24.4",
    "scipy==1.15.2",
    "scikit-learn==1.0.2",
    "pandas==2.2.2",
    "seaborn==0.13.0",
    "matplotlib==3.7.2",
    "submitit==1.5.2",
    "tqdm==4.62.1",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "ConfigSpace==0.4.21",
    "neural-pipeline-search",

    # if these don't work immediately:
    "ifBO_icml2024/src/neps_lcpfn_hpo",
    "ifBO_icml2024/src/mf-prior-bench",
    "ifBO_icml2024/src/PFNs4HPO"

    # torch with gpu support
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]
