    { name="Tim Ruhkopf", email="timruhkopf@gmail.com" },
    { name="Dang Hung Do"},
    { name="Marius Lindauer"}
]
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "numpy==1.24.4",
    "scipy==1.15.2",
    "scikit-learn==1.0.2",
    "pandas==2.2.2",
    "seaborn==0.13.0",
